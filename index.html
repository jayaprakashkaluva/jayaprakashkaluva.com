<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        a {
            color: #1a73e8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            .iframe-container {
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to jayaprakashkaluva.com</h1>
    </header>
    <div class="container">
        <h2>LLM Model Files Guide</h2>
        <div class="iframe-container">
            <iframe src="model_content.html" title="LLM Model Files Guide"></iframe>
        </div>
    </div>
</body>
</html>
